name: Verify Project Draugr

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and PostgreSQL persistence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        # Testcontainers uses the runner's Docker engine; the full-tick playthrough
        # (incl. the #16 fresh-awakening regression) and the migration-driven boot
        # all execute here rather than skipping as they do on a Docker-less machine.
        run: mvn --batch-mode test

  routing:
    name: Routing reachability (coverage gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: draugr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply every migration in numeric order
        # Mirrors the machine-local validation in CLAUDE.md: pgcrypto first, then the
        # Flyway migrations applied V1..Vn with ON_ERROR_STOP so any ordering or DDL
        # regression fails the build here, not in a player's first boot.
        run: |
          psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          for f in $(ls backend/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "-- applying $f"
            psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Reachability probe — every VERIFIED process must route, none may collide
        # routing-reachability-probe.sql RAISEs on any miss, so a process whose inputs
        # are unobtainable or whose phrasing no longer routes exits non-zero and fails.
        run: psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -f docs/architecture/routing-reachability-probe.sql

      - name: SQL regression replays — pinned past bugs at the schema layer
        # Each tests/regression/*.sql replay RAISEs on the old-bug behaviour (e.g. an
        # UPDATE against the append-only chronicle_action ledger, or a broken narration
        # overlay COALESCE), so a regression exits non-zero here. The replays are
        # self-contained (temp tables, BEGIN/ROLLBACK) and do not disturb the applied schema.
        run: |
          for f in $(ls tests/regression/*.sql | sort); do
            echo "-- applying regression replay $f"
            psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -f "$f"
          done

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backdrop registry — validator self-tests (#223)
        working-directory: frontend
        # Self-contained: test-validation.mjs validates the committed manifest and proves the gate
        # rejects each drift class, WITHOUT reading the image bytes — so it is green even while the
        # 396 MB of backdrop PNGs are still deferred out of history. The full directory⇄manifest
        # bijection gate (npm run backdrops:check) is wired in once the assets land.
        run: npm run backdrops:test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
