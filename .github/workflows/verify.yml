name: Verify Project Draugr

on:
  pull_request:
  push:
    # development is gated on push again: #245 cleared the catalogue-integrity debt and #246 cleared the
    # dev-only M1 feature-test debt it uncovered (containers, carrying aids, water, mark/name, FullTick
    # death-ordering), so the full Testcontainers suite is green. Keep both here; if a future batch lands
    # red, fix it on a PR branch (the pull_request trigger runs the same suite) rather than dropping the gate.
    branches: [main, development]

permissions:
  contents: read

# One run per branch at a time. Several branches of one stacked chain are usually in flight together, and every
# force-push to a rebase left its predecessor queued behind the new one: the backend suite takes most of an hour,
# so a superseded run is most of an hour of queue nobody will read. The newest push for a ref is the only one
# whose answer is wanted.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and PostgreSQL persistence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        working-directory: backend
        # Testcontainers uses the runner's Docker engine; the full-tick playthrough
        # (incl. the #16 fresh-awakening regression) and the migration-driven boot
        # all execute here rather than skipping as they do on a Docker-less machine.
        run: mvn --batch-mode test

  routing:
    name: Routing reachability (coverage gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: draugr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply every migration in numeric order
        # Mirrors the machine-local validation in CLAUDE.md: pgcrypto first, then the
        # Flyway migrations applied V1..Vn with ON_ERROR_STOP so any ordering or DDL
        # regression fails the build here, not in a player's first boot.
        run: |
          psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          for f in $(ls backend/src/main/resources/db/migration/V*.sql | sort -V); do
            echo "-- applying $f"
            # -1: one transaction per file, as Flyway runs them. Without it every statement commits on its own,
            # and a migration that adds a species and then declares what it is (V346; V344's deferred trigger
            # checks at commit) fails here while booting cleanly for every player.
            psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -1 -f "$f"
          done
      - name: Reachability probe — every VERIFIED process must route, none may collide
        # routing-reachability-probe.sql RAISEs on any miss, so a process whose inputs
        # are unobtainable or whose phrasing no longer routes exits non-zero and fails.
        run: psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -f docs/architecture/routing-reachability-probe.sql

      - name: SQL regression replays — pinned past bugs at the schema layer
        # Each tests/regression/*.sql replay RAISEs on the old-bug behaviour (e.g. an
        # UPDATE against the append-only chronicle_action ledger, or a broken narration
        # overlay COALESCE), so a regression exits non-zero here. The replays are
        # self-contained (temp tables, BEGIN/ROLLBACK) and do not disturb the applied schema.
        run: |
          for f in $(ls tests/regression/*.sql | sort); do
            echo "-- applying regression replay $f"
            psql -h localhost -U postgres -d draugr -v ON_ERROR_STOP=1 -q -f "$f"
          done

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Backdrop registry — validator self-tests (#223)
        working-directory: frontend
        # Self-contained: test-validation.mjs validates the committed manifest and proves the gate
        # rejects each drift class, WITHOUT reading the image bytes — so it is green even while the
        # 396 MB of backdrop PNGs are still deferred out of history. The full directory⇄manifest
        # bijection gate (npm run backdrops:check) is wired in once the assets land.
        run: npm run backdrops:test
      - name: Frontend unit tests (#239/#242)
        working-directory: frontend
        # The rules a screenshot cannot see: which reply wins a race, whether a backdrop that will not decode is
        # ever painted, and whether someone who asked for reduced motion gets a fade anyway. Sub-second, no
        # browser — the browser-driven half of #242 is the journeys job below.
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install the test browser (#239/#242)
        working-directory: frontend
        # Chromium only, with its system libraries. The other engines would triple the download for a screen that
        # ships inside one browser (the Electron shell), so they are left out deliberately.
        run: npx playwright install --with-deps chromium
      - name: Screen framing in a real browser (#239/#242)
        working-directory: frontend
        # Serves the build above in prototype mode (no backend) and walks in as a player does, at phone, tablet,
        # laptop and wide widths plus the one between phone and tablet. Asserts what a screenshot only shows if
        # someone looks: no sideways scroll, the action field on screen and usable, nothing covering the narration.
        run: npm run test:e2e
      - name: Keep the browser report when framing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Backdrop budgets — initial payload and lazy registry (#243)
        working-directory: frontend
        # Measures the built artifact: what a player downloads before anything paints. Fails if a backdrop image or
        # the registry itself is bundled with the app, or if the initial payload grows past its budget.
        run: npm run backdrops:budget

  journeys:
    name: Journeys through the real stack (#242)
    # The framing run above serves the build in prototype mode, with no backend at all. This job puts the whole stack
    # together — PostgreSQL, the Spring backend booting and generating its world through Flyway, and the production
    # build pointed at it — and walks through it in a browser: a player's step changes what the screen asks the server
    # for, and a reload finds the same Chronicle on the same ground with the story so far.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: draugr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DRAUGR_DATABASE_URL: jdbc:postgresql://localhost:5432/draugr
      DRAUGR_DATABASE_USERNAME: postgres
      DRAUGR_DATABASE_PASSWORD: pw
      # AI stays off: the master switch defaults off, and no key is present in CI. Said here so no one wonders.
      DRAUGR_AI_ENABLED: 'false'
      DRAUGR_E2E_API: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Package the backend
        working-directory: backend
        run: mvn --batch-mode -DskipTests package
      - name: Start the backend
        working-directory: backend
        # The preview origin is allowed by CORS through draugr.frontend-origin, exactly as the launcher allows the
        # desktop shell's. Output goes to a file that is kept if the journey fails.
        run: |
          nohup java -Ddraugr.frontend-origin=http://localhost:4173 -jar target/draugr-server-*.jar > ../backend-journeys.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then echo "backend up after ${i}x5s"; exit 0; fi
            sleep 5
          done
          echo "backend did not come up"; tail -100 ../backend-journeys.log; exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build the frontend against the backend
        working-directory: frontend
        run: VITE_DRAUGR_API_URL=http://localhost:8080 npm run build
      - name: Install the test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Walk, travel and resume in a real browser
        working-directory: frontend
        run: npx playwright test e2e/journeys.e2e.ts
      - name: Keep the report and the backend log when a journey fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: |
            frontend/playwright-report
            backend-journeys.log
          retention-days: 7
