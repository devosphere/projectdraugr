spring:
  application:
    name: draugr-server
  datasource:
    url: ${DRAUGR_DATABASE_URL:jdbc:postgresql://localhost:5432/draugr}
    username: ${DRAUGR_DATABASE_USERNAME:draugr}
    password: ${DRAUGR_DATABASE_PASSWORD:draugr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-message: always

# AI layer. THE API KEY IS THE SINGLE SWITCH: drop in a key and the whole pipeline — interpret a
# real-world action → let the Architect CREATE the processes/objects it needs → narrate — is on. With
# no key the game runs on deterministic prose alone and never touches the network. Never commit a key
# here. See docs/architecture/ai-integration.md.
#
# `enabled` and `authoring-enabled` remain as explicit kill-switches (default on); set either to false
# to force that part off even when a key is present — e.g. authoring-enabled=false lets the interpreter
# reuse existing processes without the Architect authoring new ones (saves the Opus authoring calls).
draugr:
  ai:
    enabled: ${DRAUGR_AI_ENABLED:true}
    api-key: ${DRAUGR_AI_API_KEY:${ANTHROPIC_API_KEY:}}
    authoring-enabled: ${DRAUGR_AI_AUTHORING_ENABLED:true}
    max-tokens: ${DRAUGR_AI_MAX_TOKENS:1024}
    timeout: ${DRAUGR_AI_TIMEOUT:20s}
    # Per-agent models: Simulation Agent (narration) → Haiku; Interpreter → Sonnet 4.6; Architect + QA → Opus 4.8; Auditor → Sonnet 4.6.
    narration-model: ${DRAUGR_AI_NARRATION_MODEL:claude-haiku-4-5}
    interpreter-model: ${DRAUGR_AI_INTERPRETER_MODEL:claude-sonnet-4-6}
    architect-model: ${DRAUGR_AI_ARCHITECT_MODEL:claude-opus-4-8}
    qa-model: ${DRAUGR_AI_QA_MODEL:claude-opus-4-8}
    auditor-model: ${DRAUGR_AI_AUDITOR_MODEL:claude-sonnet-4-6}
