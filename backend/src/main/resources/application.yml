spring:
  application:
    name: draugr-server
  datasource:
    url: ${DRAUGR_DATABASE_URL:jdbc:postgresql://localhost:5432/draugr}
    username: ${DRAUGR_DATABASE_USERNAME:draugr}
    password: ${DRAUGR_DATABASE_PASSWORD:draugr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-message: always

# Optional AI narration (the Simulation Agent's voice). Off by default: the game runs on
# deterministic prose alone until you switch it on and supply a key. Never commit a key here.
# See docs/architecture/ai-integration.md.
draugr:
  ai:
    enabled: ${DRAUGR_AI_ENABLED:false}
    api-key: ${DRAUGR_AI_API_KEY:${ANTHROPIC_API_KEY:}}
    max-tokens: ${DRAUGR_AI_MAX_TOKENS:1024}
    timeout: ${DRAUGR_AI_TIMEOUT:20s}
    # Per-agent models: Simulation Agent (narration) → Haiku; Architect → Opus 4.8; Auditor → Sonnet 4.6.
    narration-model: ${DRAUGR_AI_NARRATION_MODEL:claude-haiku-4-5}
    architect-model: ${DRAUGR_AI_ARCHITECT_MODEL:claude-opus-4-8}
    auditor-model: ${DRAUGR_AI_AUDITOR_MODEL:claude-sonnet-4-6}
