spring:
  application:
    name: draugr-server
  datasource:
    url: ${DRAUGR_DATABASE_URL:jdbc:postgresql://localhost:5432/draugr}
    username: ${DRAUGR_DATABASE_USERNAME:draugr}
    password: ${DRAUGR_DATABASE_PASSWORD:draugr}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

server:
  error:
    include-message: always

# AI layer — MASTER switch over per-agent switches.
#   enabled (MASTER): default OFF. A key alone never activates AI — you must turn the master on. This
#     keeps launch security and the secret key meaningful. Set DRAUGR_AI_ENABLED=true (with a key) and
#     the WHOLE pipeline comes on at once: interpret → let the Architect CREATE new mechanics → narrate.
#   Per-agent switches below default ON, so the single master lights up every agent with no further
#     toggling. Set one to false to silence just that agent (e.g. authoring-enabled=false keeps
#     interpretation of existing processes but stops the Architect's Opus authoring calls).
# With the master off, or no key, the game runs on deterministic prose alone and never touches the network.
# Never commit a key here. See docs/architecture/ai-integration.md.
draugr:
  ai:
    enabled: ${DRAUGR_AI_ENABLED:false}
    api-key: ${DRAUGR_AI_API_KEY:${ANTHROPIC_API_KEY:}}
    narration-enabled: ${DRAUGR_AI_NARRATION_ENABLED:true}
    interpreter-enabled: ${DRAUGR_AI_INTERPRETER_ENABLED:true}
    authoring-enabled: ${DRAUGR_AI_AUTHORING_ENABLED:true}
    auditor-enabled: ${DRAUGR_AI_AUDITOR_ENABLED:true}
    qa-enabled: ${DRAUGR_AI_QA_ENABLED:true}
    max-tokens: ${DRAUGR_AI_MAX_TOKENS:1024}
    timeout: ${DRAUGR_AI_TIMEOUT:20s}
    # Per-agent models: Simulation Agent (narration) → Haiku; Interpreter → Sonnet 4.6; Architect + QA → Opus 4.8; Auditor → Sonnet 4.6.
    narration-model: ${DRAUGR_AI_NARRATION_MODEL:claude-haiku-4-5}
    interpreter-model: ${DRAUGR_AI_INTERPRETER_MODEL:claude-sonnet-4-6}
    architect-model: ${DRAUGR_AI_ARCHITECT_MODEL:claude-opus-4-8}
    qa-model: ${DRAUGR_AI_QA_MODEL:claude-opus-4-8}
    auditor-model: ${DRAUGR_AI_AUDITOR_MODEL:claude-sonnet-4-6}
